name: Build Custom Windows Client

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM / Clang
        run: choco install llvm -y

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          targets: x86_64-pc-windows-msvc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Set up VCPKG and Cache
        run: |
          vcpkg integrate install

      - name: Build RustDesk Client
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ vars.RENDEZVOUS_SERVER || secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ vars.RS_PUB_KEY || secrets.RS_PUB_KEY }}
        run: |
          python3 build.py --portable --flutter

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovinDesk-Windows-x64
          path: |
            target/release/rustdesk.exe
            libs/portable/*.exe
            build/windows/runner/Release/
          if-no-files-found: warn
